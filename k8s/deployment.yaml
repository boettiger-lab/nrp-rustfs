apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: boettiger-lab
  labels:
    k8s-app: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: rustfs
  # Recreate (not RollingUpdate) because the PVC is ReadWriteOnce —
  # a rolling update would try to mount the volume on a second pod before
  # the old one releases it.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        k8s-app: rustfs
    spec:
      # Pin to us-west region to co-locate with the rook-ceph-block PVC,
      # and avoid GPU nodes.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values: ["true"]

      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10001:10001 /data /logs"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
          securityContext:
            runAsUser: 0

      containers:
        - name: rustfs
          # PINNED TO A DIGEST — do not put a floating tag back here.
          #
          # This store holds the only second copy of the LLM proxy logs
          # (geo-agent-ops#117), and it is deleted and re-created WEEKLY by
          # refresh-cronjob.yaml. With `:latest` + `imagePullPolicy: Always` that
          # was a fresh roll of the dice every Sunday at 03:00, unattended, with
          # no record of what had been running and no way to roll back — "put the
          # old one back" is not an available action when nothing wrote down what
          # the old one was.
          #
          # What this digest is (resolved from `:latest` on 2026-08-17, which had
          # been running unchanged since 2026-08-16):
          #
          #   version   v1.0.0-beta.12   (label `release`; build-type prerelease)
          #   revision  8601179c3989d131fb68fa311fd517fe281270fe
          #   built     2026-07-30T04:16:07Z
          #
          # ⚠️ `:latest` is NOT the newest build and is NOT an alias of any release
          # tag. It resolved to beta.12 while `1.0.0-rc.1` and `1.0.0-rc.2` had
          # already shipped (`rc` → sha256:7d6d361c…). So "just use latest" was not
          # even tracking upstream's current release — another reason not to.
          #
          # TO UPGRADE: pick a tag deliberately, resolve it to a digest, put the
          # digest here, and commit. Never point this at a tag, even briefly — the
          # weekly refresh applies whatever is on `main`.
          #
          #   docker buildx imagetools inspect rustfs/rustfs:<tag>   # or crane digest
          #
          # IfNotPresent, not Always: a digest is immutable, so re-pulling it on
          # every pod start buys nothing and just adds a registry round-trip to the
          # restart path of a single-replica store.
          image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
          imagePullPolicy: IfNotPresent

          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001

          env:
            # Storage
            - name: RUSTFS_VOLUMES
              value: "/data"
            # Network
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            # Region must match what clients expect.
            - name: RUSTFS_REGION
              value: "us-east-1"
            # The virtual-host domain allowlist — EVERY name a client may dial this
            # server by, not just the public one.
            #
            # rustfs picks addressing style from the request `Host`. A Host in this
            # list, or a bare IP, is treated as PATH style; anything else is parsed
            # as VIRTUAL-HOST style, so its first label is taken to be a bucket name.
            # `rustfs-s3.boettiger-lab.svc.cluster.local` was therefore read as bucket
            # `rustfs-s3`, and the real request against the caller's bucket failed
            # authorization.
            #
            # The symptom is a blanket `AccessDenied` that no credential or policy
            # change fixes, and that covers `list_buckets` too — which is how you tell
            # it apart from a real permissions problem. The same key against the
            # ClusterIP (an IP can't be virtual-host style) or the public name works.
            #
            # Listing only the public name meant in-cluster clients could not
            # authenticate at all and had to be routed back out through the ingress
            # (geo-agent-ops#126). For the LLM proxy log mirror that sent ~65 MB of
            # Parquet out of the pod network and back in on every run, and produced a
            # real `PutObject … (reached max retries: 4): timeout`.
            #
            # Each spelling is a DISTINCT Host — SigV4 signs the host, so there is no
            # suffix matching. Add a name here BEFORE pointing an in-cluster client
            # at it.
            - name: RUSTFS_SERVER_DOMAINS
              value: "rustfs.nrp-nautilus.io,rustfs-s3.boettiger-lab.svc.cluster.local,rustfs-s3.boettiger-lab.svc,rustfs-s3.boettiger-lab,rustfs-s3"
            # CORS — allow all origins so browser-based tools work.
            - name: RUSTFS_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS
              value: "*"
            # Object cache.
            - name: RUSTFS_OBJECT_CACHE_ENABLE
              value: "true"
            - name: RUSTFS_OBJECT_CACHE_TTL_SECS
              value: "300"

            # Admin credentials from k8s secret.
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY

          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: logs
          emptyDir: {}
