apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: boettiger-lab
  labels:
    k8s-app: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: rustfs
  # Recreate (not RollingUpdate) because the PVC is ReadWriteOnce —
  # a rolling update would try to mount the volume on a second pod before
  # the old one releases it.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        k8s-app: rustfs
    spec:
      # Pin to us-west region to co-locate with the rook-ceph-block PVC,
      # and avoid GPU nodes.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
                  - key: feature.node.kubernetes.io/pci-10de.present
                    operator: NotIn
                    values: ["true"]

      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10001:10001 /data /logs"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
          securityContext:
            runAsUser: 0

      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          imagePullPolicy: Always

          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001

          env:
            # Storage
            - name: RUSTFS_VOLUMES
              value: "/data"
            # Network
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            # Region must match what clients expect.
            - name: RUSTFS_REGION
              value: "us-east-1"
            # Virtual-hosted-style domain for AWS SDK compatibility.
            - name: RUSTFS_SERVER_DOMAINS
              value: "rustfs.nrp-nautilus.io"
            # CORS — allow all origins so browser-based tools work.
            - name: RUSTFS_CORS_ALLOWED_ORIGINS
              value: "*"
            - name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS
              value: "*"
            # Object cache.
            - name: RUSTFS_OBJECT_CACHE_ENABLE
              value: "true"
            - name: RUSTFS_OBJECT_CACHE_TTL_SECS
              value: "300"

            # Admin credentials from k8s secret.
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY

          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: logs
          emptyDir: {}
